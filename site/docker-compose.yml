services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SITE_ORIGIN: "https://${DOMAIN}"
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    expose: ["8080"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN}"
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
