<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Серия 3 — новые герои и фоны</title>
<style>
  body{margin:0;background:#05070f;color:#f3e6c8;font-family:Inter,"DejaVu Sans",sans-serif}
  #sheet{width:1920px;padding:36px 32px 40px;box-sizing:border-box}
  h1{font-size:40px;margin:0 0 4px;letter-spacing:2px} h1 span{color:#e8743b}
  .sub{opacity:.6;font-size:20px;margin-bottom:22px}
  h2{font-size:22px;letter-spacing:4px;color:#e8743b;margin:26px 0 12px;text-transform:uppercase}
  .row{display:flex;gap:18px}
  .card{min-width:0;background:#0c1122;border:2px solid #232c4a;border-radius:14px;flex:1;text-align:center;padding:10px 6px 12px}
  .card svg{width:100%;height:auto;display:block}
  .card b{display:block;font-size:22px;margin-top:4px}.card i{font-style:normal;font-size:15px;opacity:.6}
  .bgs .card{padding:8px}.bgs svg{border-radius:8px}
</style></head><body><div id="sheet"></div>
<script src="../../seriya-01/art/art.js"></script><script src="../../seriya-02/art/art2.js"></script><script src="art3.js"></script>
<script>
const A = ART, D = A.defs();
const svg = (w,h,vb,inner)=>`<svg width="${w}" height="${h}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${D}${inner}</svg>`;
const card=(s,name,note)=>`<div class="card">${s}<b>${name}</b><i>${note}</i></div>`;
const ch=(inner,name,note)=>card(svg(300,400,'-190 -540 380 560',`<rect x="-190" y="-540" width="380" height="560" fill="#0c1122"/><ellipse cx="0" cy="-200" rx="170" ry="260" fill="url(#gGlow)" opacity=".12"/>`+inner),name,note);
const pr=(inner,vb,name,note)=>card(svg(260,190,vb,inner),name,note);
const bgc=(inner,name,note)=>card(svg(243,432,'0 0 1080 1920',inner),name,note);
const at=(x,y,s,inner)=>`<g transform="translate(${x},${y}) scale(${s})">${inner}</g>`;
document.getElementById('sheet').innerHTML = `
<h1>ПАДЕНИЕ МЕТЕОРИТА <span>· серия 3 · «Щит»</span></h1>
<div class="sub">Новые герои, предметы и фоны. Аня, Зина, пассажир, седан — из прошлых серий, без изменений.</div>
<h2>Герои</h2><div class="row">
${ch(A.engineerNoGlasses({aR:30,aR2:80,glassesInHand:[110,-250]}),'Пассажир без очков','«Пока там были люди…»')}
${ch(A.lena({}),'Лена','дочка Ани, ~35')}
${ch(A.lena({phone:true,aR:150,aR2:170,mouth:'open',look:-3}),'Лена — звонок','«Мама, мы у него»')}
${ch(at(0,0,1.4,A.tyoma({})),'Тёма','внук, ~6, красная кепка')}
${ch(at(0,0,.72,A.stranger({reach:.5})),'«Тот, кто вышел»','только силуэт')}
${ch(at(0,0,1.4,A.tyoma({back:true,cap:false}))+at(0,-130,1,''),'Тёма — без кепки','кепка осталась в пыли')}
</div>
<h2>Предметы</h2><div class="row">
${pr(at(30,0,.3,A.missile({})),'-130 -95 260 190','Ракета','красная точка с хвостом')}
${pr(at(0,30,1.2,A.cap(1)),'-130 -95 260 190','Тёмина кепка','в пыли у элеватора')}
${pr(at(0,70,.36,A.landed({hatch:0})),'-130 -95 260 190','Объект сел','люк закрыт')}
${pr(at(0,70,.36,A.landed({hatch:1})),'-130 -95 260 190','Люк открыт','свет изнутри')}
${pr(at(0,-30,.3,A.watch('4:00')),'-130 -95 260 190','Часы Зины','4:00 → 2:00')}
${pr(A.phone(true),'-160 -120 320 240','Телефон','сеть появилась')}
</div>
<h2>Фоны · 9:16</h2><div class="row bgs">
${bgc(A.bg.emptyField({dust:.4}),'1. Посадка','пыль кольцом')}
${bgc(A.bg.emptyField({objS:.35,objY:1180}),'2. Пустое поле','люди ушли')}
${bgc(A.bg.hq({dotP:1})+at(540,1920,1.6,A.engineerNoGlasses({aR:30,aR2:80,glassesInHand:[110,-250]})),'3. Штаб','экран: удар по полю')}
${bgc(A.bg.emptyField({objS:.3,objY:1180})+at(820,520,.35,A.missile({})),'4. Ракета','на горизонте')}
${bgc(A.bg.yard({})+at(560,1720,1,A.cap(.8)),'5. У элеватора','кепка в пыли')}
${bgc(A.bg.emptyField({hatch:1,objS:.9,objY:1500})+at(700,1560,.7,A.stranger({reach:.6}))+at(470,1580,.8,A.tyoma({back:true,cap:false})),'6. Обрыв','кто-то вышел')}
</div>`;
</script></body></html>
