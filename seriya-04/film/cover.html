<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обложка — серия 4</title>
<style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body><svg id="cover" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../seriya-01/art/art.js"></script><script src="../../seriya-02/art/art2.js"></script><script src="../../seriya-03/art/art3.js"></script><script src="../art/art4.js"></script>
<script>
const A = ART, P = A.P, F = 'font-family="Inter, DejaVu Sans, sans-serif"';
const at = (x, y, s, inner, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">${inner}</g>`;
document.getElementById('cover').innerHTML = A.defs() + `
  <defs><radialGradient id="gVig" cx=".5" cy=".45" r=".8"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient>
  <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070f" stop-opacity="0"/><stop offset="1" stop-color="#05070f" stop-opacity=".95"/></linearGradient>
  <linearGradient id="gColumn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  ${A.bg.emptyField({ objS: .7, objY: 1300, hatch: 1, glow: 1.2 })}
  ${at(860, 300, .55, A.missile({}), 150)}
  ${at(640, 2120, 1.65, A.kostya({ lamps: 1 }))}
  ${at(330, 2010, 1.9, A.tyoma({ back: true, cap: false, aR: -40, aR2: -50 }))}
  <rect y="1500" width="1080" height="420" fill="url(#gFloor)"/>
  <rect width="1080" height="1920" fill="url(#gVig)"/>
  <g text-anchor="middle" ${F} font-weight="900" stroke="#05070f" stroke-linejoin="round" paint-order="stroke">
    <text x="540" y="640" font-size="150" letter-spacing="2" stroke-width="30" fill="${P.pale}">ПАДЕНИЕ</text>
    <text x="540" y="790" font-size="132" letter-spacing="2" stroke-width="30" fill="${P.ember}">МЕТЕОРИТА</text>
  </g>
  <g transform="translate(540 870)"><rect x="-300" y="-48" width="600" height="92" rx="46" fill="${P.red}"/><text x="0" y="16" text-anchor="middle" ${F} font-weight="900" font-size="50" letter-spacing="3" fill="#fff">СЕРИЯ 4 · ВАХТА</text></g>
  <text x="540" y="1010" text-anchor="middle" ${F} font-weight="800" font-size="50" fill="${P.pale}" stroke="#05070f" stroke-width="14" stroke-linejoin="round" paint-order="stroke">Он знал, как зовут Тёму</text>`;
</script></body></html>
