<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Серия 4 — новые герои и фоны</title>
<style>
  body{margin:0;background:#05070f;color:#f3e6c8;font-family:Inter,"DejaVu Sans",sans-serif}
  #sheet{width:1920px;padding:36px 32px 40px;box-sizing:border-box}
  h1{font-size:40px;margin:0 0 4px;letter-spacing:2px} h1 span{color:#e8743b}
  .sub{opacity:.6;font-size:20px;margin-bottom:22px}
  h2{font-size:22px;letter-spacing:4px;color:#e8743b;margin:26px 0 12px;text-transform:uppercase}
  .row{display:flex;gap:18px}
  .card{min-width:0;background:#0c1122;border:2px solid #232c4a;border-radius:14px;flex:1;text-align:center;padding:10px 6px 12px}
  .card svg{width:100%;height:auto;display:block}
  .card b{display:block;font-size:22px;margin-top:4px}.card i{font-style:normal;font-size:15px;opacity:.6}
  .bgs .card{padding:8px}.bgs svg{border-radius:8px}
</style></head><body><div id="sheet"></div>
<script src="../../seriya-01/art/art.js"></script><script src="../../seriya-02/art/art2.js"></script><script src="../../seriya-03/art/art3.js"></script><script src="art4.js"></script>
<script>
const A = ART, D = A.defs();
const svg = (w,h,vb,inner)=>`<svg width="${w}" height="${h}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${D}${inner}</svg>`;
const card=(s,name,note)=>`<div class="card">${s}<b>${name}</b><i>${note}</i></div>`;
const ch=(inner,name,note)=>card(svg(300,400,'-190 -540 380 560',`<rect x="-190" y="-540" width="380" height="560" fill="#0c1122"/><ellipse cx="0" cy="-200" rx="170" ry="260" fill="url(#gGlow)" opacity=".12"/>`+inner),name,note);
const pr=(inner,vb,name,note)=>card(svg(260,190,vb,inner),name,note);
const bgc=(inner,name,note)=>card(svg(243,432,'0 0 1080 1920',inner),name,note);
const at=(x,y,s,inner)=>`<g transform="translate(${x},${y}) scale(${s})">${inner}</g>`;
document.getElementById('sheet').innerHTML = `
<h1>ПАДЕНИЕ МЕТЕОРИТА <span>· серия 4 · «Вахта»</span></h1>
<div class="sub">Новые герои и кадры. Аня, Зина, Лена, Тёма, седан, объект — из прошлых серий, без изменений.</div>
<h2>Герои</h2><div class="row">
${ch(at(0,0,.78,A.kostya({})),'«Тот, кто вышел»','скафандр, фонари шлема')}
${ch(at(0,0,.78,A.kostya({visor:'up'})),'Костя','отец Тёмы, стекло поднято')}
${ch(at(0,0,.78,A.kostya({visor:'up',aR:150,aR2:200,mouth:'open'})),'Костя — «Сигнал — это я»','маячок на груди')}
${ch(at(0,0,.78,A.kostya({visor:'down',walk:1,lamps:1})),'Костя уходит','в поле, один')}
${ch(A.lena({mouth:'open',look:3}),'Лена','узнаёт мужа')}
${ch(at(0,0,1.4,A.tyoma({walk:1.2,cap:false})),'Тёма бежит','за отцом')}
</div>
<h2>Предметы</h2><div class="row">
${pr(at(-60,40,1.6,'<g transform="rotate(-12)"><rect x="-26" y="-18" width="52" height="40" rx="6" fill="#e8743b"/><text x="0" y="8" text-anchor="middle" font-family="Inter" font-weight="900" font-size="11" fill="#fff">ОРБИТА</text></g>'),'-130 -95 260 190','Нашивка','на плече скафандра')}
${pr(at(0,30,.4,A.carInDitch(0)),'-130 -95 260 190','Седан в канаве','у самого объекта')}
${pr(at(0,-30,.3,A.watch('1:00')),'-130 -95 260 190','Часы Зины','2:00 → 1:00')}
${pr(at(30,0,.3,A.missile({})),'-130 -95 260 190','Ракета','поворачивает за сигналом')}
</div>
<h2>Фоны · 9:16</h2><div class="row bgs">
${bgc(A.bg.emptyField({objS:.4,objY:1200}),'1. Поле напрямик','800 м до центра')}
${bgc(A.bg.emptyField({objS:1.1,objY:1560,hatch:1})+at(560,1720,.5,A.carInDitch(0)),'2. У объекта','машина в канаве')}
${bgc(A.bg.emptyField({objS:1.4,objY:1750,hatch:1})+at(640,1820,1,A.kostya({}))+at(380,1830,1.1,A.tyoma({back:true,cap:false})),'3. Он и Тёма','держит за руку')}
${bgc(A.bg.emptyField({objS:.6,objY:1300,hatch:1})+at(540,1260,.35,A.kostya({walk:1}))+at(700,500,.35,A.missile({}),150),'4. Обрыв','ракета за ним')}
</div>`;
</script></body></html>
