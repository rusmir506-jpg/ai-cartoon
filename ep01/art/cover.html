<!doctype html><html><head><meta charset="utf-8"><title>Обложка</title>
<style>html,body{margin:0;background:#000}</style>
<script src="assets.js"></script><script src="words.js"></script><script src="anim.js"></script></head>
<body><div id="v"></div><script>
const t = 3.3;
let eyes = '';
for (let i = 0; i < 24; i++) { const x = hash(i * 3.3) * 1040 + 20, y = 1080 + hash(i * 7.1) * 560, s = .5 + (y - 1050) / 620;
  eyes += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${s.toFixed(2)})"><circle r="26" fill="${PAL.eyeGlow}" opacity=".18"/><ellipse rx="11" ry="11" fill="${PAL.eye}"/><ellipse rx="2.5" ry="8" fill="#0b0f08"/></g>`; }
const T = (y, txt, size, fill, extra = '') => `<text x="540" y="${y}" text-anchor="middle" font-family="Inter" font-weight="900" font-size="${size}" fill="${fill}" stroke="#000" stroke-width="${size * .16}" stroke-linejoin="round" paint-order="stroke" ${extra}>${txt}</text>`;
document.getElementById('v').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">${defsCommon}<defs>${SIL}
  <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>
  <g transform="translate(0 40)">${bgRiver()}${ripples(t)}
  <circle cx="540" cy="560" r="520" fill="#3d6470" opacity=".35"/><circle cx="540" cy="560" r="300" fill="#6d9aa6" opacity=".18"/><clipPath id="aw"><rect x="-500" y="-1000" width="2080" height="2045"/></clipPath>
  <g clip-path="url(#aw)">${at(540, 1045, .5, giant({ rise: .7 }))}</g>${eyes}
  ${[...Array(20)].map((_, i) => `<ellipse cx="${-80 + i * 65}" cy="${1040 + Math.sin(i) * 8}" rx="${40 + hash(i) * 40}" ry="12" fill="#5f8a94" opacity=".5"/>`).join('')}
  <g filter="url(#sil)">${at(250, 1790, .75, nikita({ face: 'scared' }))}${at(360, 1790, .8, asya({ face: 'scared', torch: false }))}</g></g>
  ${rain(t, { op: .45, slant: .3, n: 200 })}
  <rect width="1080" height="700" fill="url(#topfade)"/><rect width="1080" height="1920" fill="url(#vignette)"/>
  ${T(250, 'ГИГАНТСКИЕ', 128, PAL.eye)}${T(385, 'МУТАНТЫ', 128, PAL.eye)}
  <rect x="300" y="430" width="480" height="78" rx="14" fill="${PAL.red}"/>
  <text x="540" y="486" text-anchor="middle" font-family="Inter" font-weight="900" font-size="46" fill="#fff">СЕРИЯ 1 · ЗАВОД</text>
  ${T(1330, 'РЫБА В РЕКЕ', 92, '#ffffff')}${T(1435, 'ТЕПЕРЬ СМОТРИТ', 92, '#ffffff')}${T(1540, 'НА ТЕБЯ', 92, PAL.eye)}
</svg>`;
</script></body></html>
